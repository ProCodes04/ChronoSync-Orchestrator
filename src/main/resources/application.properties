spring.application.name=orchestrator
spring.datasource.url=jdbc:postgresql://localhost:5432/chronosync
spring.datasource.username=admin
spring.datasource.password=secretpassword

# Tells the ORM to automatically create/update database tables based on our Java code
spring.jpa.hibernate.ddl-auto=update
# Shows the auto-generated SQL in our console so we can learn from it
spring.jpa.show-sql=true
spring.data.redis.host=localhost
spring.data.redis.port=6379