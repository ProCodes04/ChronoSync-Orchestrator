services:
  postgres:
    image: postgres:16-alpine
    container_name: chronosync-db
    environment:
      POSTGRES_DB: chronosync
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: chronosync-cache
    ports:
      - "6379:6379"